<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamToGrader — Апгрейдер TF2</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { background-color: #121214; color: #f3f4f6; font-family: 'Montserrat', sans-serif; user-select: none; margin: 0; padding-bottom: 40px; }
        .cyber-font { font-family: 'Teko', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
        .cyber-panel { background: #181b22; border: 1px solid #272b36; box-shadow: 0 4px 20px rgba(0,0,0,0.5); border-radius: 1rem; padding: 20px; }
        
        button, input, .clickable { 
            cursor: pointer !important; 
            pointer-events: auto !important; 
        }
        
        .cyber-btn { 
            background: linear-gradient(135deg, #f3ba2f 0%, #d49a15 100%); 
            color: #121214; 
            font-weight: 800; 
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-family: 'Montserrat', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(243, 186, 47, 0.3); 
            transition: 0.2s;
            width: 100%;
        }
        .cyber-btn:hover:not(:disabled) { 
            background: linear-gradient(135deg, #ffd15c 0%, #e0a418 100%); 
            transform: translateY(-1px); 
        }
        .cyber-btn:disabled { opacity: 0.4; cursor: not-allowed !important; }

        .item-card { 
            background: #1e222b; 
            border: 1px solid #2c323f; 
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        .item-card:hover { border-color: #f3ba2f; transform: translateY(-2px); }
        .item-card.selected { border-color: #f3ba2f !important; background: rgba(243, 186, 47, 0.15); box-shadow: 0 0 10px rgba(243, 186, 47, 0.3); }

        .tab-btn { background: #1c2029; border: 1px solid #2e3544; color: #9ba1a6; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; text-transform: uppercase; transition: 0.2s; }
        .tab-btn.active { background: #f3ba2f; color: #121214; border-color: #f3ba2f; }

        .case-roulette-container { overflow: hidden; position: relative; width: 100%; height: 120px; background: #0d0e11; border-radius: 1rem; border: 2px solid #272b36; margin: 20px 0; }
        .case-roulette-track { display: flex; position: absolute; left: 0; top: 10px; height: 100px; transition: transform 4.5s cubic-bezier(0.1, 1, 0.1, 1); }
        .case-item-card { width: 100px; height: 96px; flex-shrink: 0; background: #181b22; border: 1px solid #2e3544; margin: 0 5px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5px; }
        .case-marker { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #f3ba2f; transform: translateX(-50%); z-index: 20; box-shadow: 0 0 12px #f3ba2f; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #2e3544; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header style="background: #181b22; border-bottom: 1px solid #272b36; padding: 12px 24px; position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 40px; height: 40px; background: linear-gradient(135deg, #f3ba2f, #d49a15); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #121214; font-size: 20px; font-weight: 900;">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="cyber-font" style="font-size: 28px; color: #f3ba2f; margin: 0; line-height: 1;">TeamToGrader</h1>
                    <p style="font-size: 9px; color: #9ba1a6; margin: 2px 0 0; font-weight: 700; letter-spacing: 1px;">АПГРЕЙДЕР TF2</p>
                </div>
            </div>

            <!-- TABS -->
            <div style="display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 12px; border: 1px solid #272b36;">
                <button type="button" onclick="switchTab('upgrader')" id="tab-btn-upgrader" class="tab-btn active">⚡ Апгрейд</button>
