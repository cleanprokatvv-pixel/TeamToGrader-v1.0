<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeamToGrader — TF2 Upgrader</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Titantium++Bold&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #1b1715 url('https://www.transparenttextures.com/patterns/dark-leather.png'); 
            color: #f3f4f6; 
            font-family: 'Montserrat', sans-serif; 
            user-select: none; 
            margin: 0; 
            padding-bottom: 40px; 
        }
        
        .tf-font { font-family: 'Teko', sans-serif; letter-spacing: 0.05em; text-transform: uppercase; }
        
        /* TF2 Panel Style */
        .tf-panel { 
            background: #2b2522; 
            border: 2px solid #3e3530; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 6px 20px rgba(0,0,0,0.7); 
            border-radius: 12px; 
            padding: 16px; 
        }
        
        /* Buttons */
        .tf-btn { 
            background: linear-gradient(180deg, #e7b53b 0%, #b88314 100%); 
            color: #171311; 
            font-weight: 900; 
            border: 2px solid #f9d877;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.4); 
            transition: all 0.15s ease;
            width: 100%;
            cursor: pointer;
        }
        .tf-btn:hover:not(:disabled) { 
            background: linear-gradient(180deg, #ffd466 0%, #d4971c 100%); 
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(231, 181, 59, 0.4);
        }
        .tf-btn:active:not(:disabled) { transform: translateY(1px); }
        .tf-btn:disabled { opacity: 0.4; cursor: not-allowed !allowed; border-color: #555; }

        /* Item Cards */
        .item-card { 
            background: #1e1917; 
            border: 2px solid #3c332d; 
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
        }
        .item-card:hover { border-color: #e7b53b; transform: translateY(-2px); }
        .item-card.selected { 
            border-color: #e7b53b !important; 
            background: #342a22; 
            box-shadow: 0 0 12px rgba(231, 181, 59, 0.4); 
        }

        /* Quality Colors */
        .q-unique { color: #ffd700; border-color: #ffd700; }
        .q-strange { color: #cf6a32; border-color: #cf6a32; }
        .q-vintage { color: #476291; border-color: #476291; }
        .q-australium { color: #f3ba2f; border-color: #f3ba2f; }
        .q-unusual { color: #8650ac; border-color: #8650ac; }

        .tab-btn { 
            background: #231d1a; 
            border: 1px solid #3e3530; 
            color: #a89f91; 
            padding: 8px 16px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 13px; 
            text-transform: uppercase; 
            transition: 0.2s;
            cursor: pointer;
        }
        .tab-btn.active { background: #e7b53b; color: #171311; border-color: #f9d877; font-weight: 800; }

        /* Wheel Container */
        .wheel-box {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rotating Arrow Overlay */
        .arrow-spinner {
            position: absolute;
            top: 0;
            left: 0;
            width: 260px;
            height: 260px;
            pointer-events: none;
            z-index: 10;
            transform-origin: center center;
        }
        .arrow-pointer {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #e7b53b;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.8));
        }

        .hidden { display: none !important; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #3e3530; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- HEADER / NAVBAR -->
    <header style="background: #231d1a; border-bottom: 3px solid #e7b53b; padding: 12px 24px; position: sticky; top: 0; z-index: 100;">
        <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 44px; height: 44px; background: linear-gradient(135deg, #e7b53b, #b88314); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #171311; font-size: 24px; font-weight: 900; border: 2px solid #f9d877;">
                    <i class="fa-solid fa-crosshairs"></i>
                </div>
                <div>
                    <h1 class="tf-font" style="font-size: 32px; color: #e7b53b; margin: 0; line-height: 0.9;">TeamToGrader</h1>
                    <p style="font-size: 10px; color: #a89f91; margin: 2px 0 0; font-weight: 800; letter-spacing: 1.5px;">TF2 MANN CO. UPGRADER</p>
                </div>
            </div>

            <!-- TABS -->
            <div style="display: flex; gap: 6px; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 10px; border: 1px solid #3e3530;">
                <button type="button" onclick="switchTab('upgrader')" id="tab-btn-upgrader" class="tab-btn active">⚡ Апгрейд</button>
                <button type="button" onclick="switchTab('shop')" id="tab-btn-shop" class="tab-btn">🛒 Магазин</button>
                <button type="button" onclick="switchTab('inventory')" id="tab-btn-inventory" class="tab-btn">🎒 Інвентар</button>
            </div>

            <!-- BALANCE -->
            <div style="background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 10px; border: 1px solid #3e3530; display: flex; align-items: center; gap: 12px;">
                <div>
                    <span style="font-size: 9px; color: #a89f91; display: block; font-weight: 700;">БАЛАНС</span>
                    <span id="balCoins" class="tf-font" style="font-size: 26px; color: #e7b53b; line-height: 1;">100 ТК</span>
                </div>
                <button type="button" onclick="addFreeCoins()" style="background: #3e3530; border: none; border-radius: 6px; color: #e74c3c; width: 30px; height: 30px; font-weight: bold;" title="Поповнити по 100 ТК">+</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main style="max-width: 1200px; width: 100%; margin: 20px auto; padding: 0 20px;">

        <!-- TAB 1: UPGRADER -->
        <div id="section-upgrader" style="display: grid; grid-template-columns: 280px 1fr 280px; gap: 20px; align-items: start;">
            
            <!-- Left: Inventory -->
            <div class="tf-panel" style="height: 580px; display: flex; flex-direction: column;">
                <h3 style="font-size: 13px; color: #a89f91; text-transform: uppercase; margin: 0 0 10px; border-bottom: 1px solid #3e3530; padding-bottom: 8px;">
                    <i class="fa-solid fa-boxes-stacked text-amber-400"></i> Ваш інвентар
                </h3>
                <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 8px; border: 1px solid #3e3530;">
                    <span style="font-size: 11px; color: #a89f91; font-weight: 700;">Ставка монетами:</span>
                    <input id="directRef" type="number" min="0" value="0" oninput="calcOdds()" style="width: 80px; background: #171311; border: 1px solid #3e3530; text-align: right; padding: 4px 8px; border-radius: 6px; color: #e7b53b; font-weight: 700;">
                </div>
                <div id="invGrid" style="flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; padding-right: 4px;"></div>
                <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #3e3530; text-align: center; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;">
                    <span style="font-size: 10px; color: #a89f91; font-weight: 700; display: block;">СУМА СТАВКИ</span>
                    <div id="totalBet" class="tf-font" style="font-size: 28px; color: #e7b53b;">0 ТК</div>
                </div>
            </div>

            <!-- Center: Wheel -->
            <div class="tf-panel" style="height: 580px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; position: relative;">
                <div style="text-align: center; width: 100%;">
                    <span id="targetBadge" style="font-size: 10px; background: rgba(0,0,0,0.5); color: #a89f91; padding: 4px 12px; border-radius: 20px; border: 1px solid #3e3530; text-transform: uppercase; font-weight: 700;">Оберіть предмет праворуч</span>
                    <h2 id="targetName" class="tf-font" style="font-size: 34px; color: #fff; margin: 8px 0 0;">---</h2>
                </div>

                <!-- Wheel Canvas with Rotating Arrow -->
                <div class="wheel-box">
                    <canvas id="wheelCanvas" width="260" height="260" style="border-radius: 50%; box-shadow: 0 0 25px rgba(0,0,0,0.9);"></canvas>
                    <div id="arrowSpinner" class="arrow-spinner">
                        <div class="arrow-pointer"></div>
                    </div>
                </div>

                <div style="background: rgba(0,0,0,0.6); padding: 6px 24px; border-radius: 20px; border: 1px solid #3e3530; text-align: center;">
                    <span style="font-size: 10px; color: #a89f91; text-transform: uppercase; font-weight: 700; display: block;">Шанс успіху</span>
                    <span id="chanceText" class="tf-font" style="font-size: 42px; color: #e7b53b; line-height: 1;">0.00%</span>
                </div>

                <button type="button" id="upgradeBtn" onclick="startUpgrade()" disabled class="tf-btn">ПОКРАЩИТИ</button>
            </div>

            <!-- Right: Target Catalog -->
            <div class="tf-panel" style="height: 580px; display: flex; flex-direction: column;">
                <h3 style="font-size: 13px; color: #a89f91; text-transform: uppercase; margin: 0 0 10px; border-bottom: 1px solid #3e3530; padding-bottom: 8px;">
                    <i class="fa-solid fa-bullseye text-amber-400"></i> Цілі для апгрейду
                </h3>
                <div id="catalogGrid" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px;"></div>
            </div>
        </div>

        <!-- TAB 2: SHOP -->
        <div id="section-shop" class="hidden tf-panel">
            <h2 class="tf-font" style="font-size: 32px; color: #e7b53b; margin-top: 0;">Магазин предметів TF2</h2>
            <div id="shopGrid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px;"></div>
        </div>

        <!-- TAB 3: INVENTORY -->
        <div id="section-inventory" class="hidden tf-panel">
            <h2 class="tf-font" style="font-size: 32px; color: #e7b53b; margin-top: 0;">Ваша колекція</h2>
            <div id="fullInvGrid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px;"></div>
        </div>

    </main>

    <!-- SCRIPT LOGIC -->
    <script>
        let balance = parseFloat(localStorage.getItem('tf_coins')) || 100.0;
        let selectedInv = [];
        let targetItem = null;
        let isSpinning = false;
        let currentArrowAngle = 0; // кут повороту стрілки в радіанах

        // База предметів TF2
        const itemsDB = [
            { id: '1', name: 'Mercenary Badge', price: 5, quality: 'unique', qClass: 'q-unique', icon: 'fa-shield-halved', color: '#ffd700' },
            { id: '2', name: 'Scout Bat', price: 8, quality: 'unique', qClass: 'q-unique', icon: 'fa-baseball-bat-ball', color: '#ffd700' },
            { id: '3', name: 'Gibus Hat', price: 12, quality: 'unique', qClass: 'q-unique', icon: 'fa-hat-wizard', color: '#ffd700' },
            { id: '4', name: 'Mann Co. Cap', price: 15, quality: 'unique', qClass: 'q-unique', icon: 'fa-graduation-cap', color: '#ffd700' },
            { id: '5', name: 'Standard Syringe Gun', price: 20, quality: 'unique', qClass: 'q-unique', icon: 'fa-syringe', color: '#ffd700' },
            { id: '6', name: 'Strange Shotgun', price: 40, quality: 'strange', qClass: 'q-strange', icon: 'fa-gun', color: '#cf6a32' },
            { id: '7', name: 'Vintage Quick-Fix', price: 65, quality: 'vintage', qClass: 'q-vintage', icon: 'fa-kit-medical', color: '#476291' },
            { id: '8', name: 'Australium Wrench', price: 140, quality: 'australium', qClass: 'q-australium', icon: 'fa-wrench', color: '#f3ba2f' },
            { id: '9', name: 'Australium Rocket Launcher', price: 550, quality: 'australium', qClass: 'q-australium', icon: 'fa-rocket', color: '#f3ba2f' },
            { id: '10', name: 'Unusual Team Captain', price: 1200, quality: 'unusual', qClass: 'q-unusual', icon: 'fa-crown', color: '#8650ac' },
            { id: '11', name: 'Golden Frying Pan', price: 5000, quality: 'australium', qClass: 'q-australium', icon: 'fa-utensils', color: '#f3ba2f' }
        ];

        let inventory = JSON.parse(localStorage.getItem('tf_inv')) || [itemsDB[0], itemsDB[1], itemsDB[2]];

        function switchTab(tab) {
            ['upgrader', 'shop', 'inventory'].forEach(t => {
                let sec = document.getElementById(`section-${t}`);
                if(sec) sec.classList.add('hidden');
                let btn = document.getElementById(`tab-btn-${t}`);
                if(btn) btn.classList.remove('active');
            });
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-btn-${tab}`).classList.add('active');

            if(tab === 'inventory') renderFullInv();
            if(tab === 'shop') renderShop();
        }

        function addFreeCoins() {
            balance += 100;
            updateUI();
        }

        function renderInv() {
            const grid = document.getElementById('invGrid');
            if(!grid) return;
            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const isSel = selectedInv.includes(index);
                const div = document.createElement('div');
                div.className = `item-card ${item.qClass} ${isSel ? 'selected' : ''}`;
                div.style.height = "110px";
                div.onclick = (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    if(isSel) selectedInv = selectedInv.filter(i => i !== index);
                    else selectedInv.push(index);
                    renderInv();
                };
                div.innerHTML = `
                    <div style="font-size: 26px;"><i class="fa-solid ${item.icon}"></i></div>
                    <div style="font-size: 10px; font-weight: 700; color: #fff; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.name}</div>
                    <div style="font-size: 10px; font-weight: 800;">${item.price} ТК</div>
                    <button type="button" onclick="sellItem(${index})" style="background:#5a1a1a; border:1px solid #852626; border-radius:4px; font-size:9px; font-weight:700; color:#ff9999; padding:2px 6px; width:100%; cursor:pointer;">Продати</button>
                `;
                grid.appendChild(div);
            });
            calcOdds();
        }

        function renderFullInv() {
            const grid = document.getElementById('fullInvGrid');
            if(!grid) return;
            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = `tf-panel item-card ${item.qClass}`;
                div.innerHTML = `
                    <div style="font-size: 34px; margin-bottom: 6px;"><i class="fa-solid ${item.icon}"></i></div>
                    <div style="font-size: 11px; font-weight: 700; color: #fff; margin-bottom: 2px;">${item.name}</div>
                    <div style="font-size: 11px; font-weight: 800; margin-bottom: 10px;">${item.price} ТК</div>
                    <button type="button" onclick="sellItem(${index})" style="background:#5a1a1a; border:1px solid #852626; color:#ff9999; padding:6px; border-radius:6px; font-size:10px; font-weight:700; width:100%; cursor:pointer;">Продати</button>
                `;
                grid.appendChild(div);
            });
        }

        function renderShop() {
            const grid = document.getElementById('shopGrid');
            if(!grid) return;
            grid.innerHTML = '';
            itemsDB.forEach(item => {
                const div = document.createElement('div');
                div.className = `tf-panel item-card ${item.qClass}`;
                div.innerHTML = `
                    <div style="font-size: 34px; margin-bottom: 8px;"><i class="fa-solid ${item.icon}"></i></div>
                    <div style="font-size: 12px; font-weight: 700; color: #fff; margin-bottom: 4px;">${item.name}</div>
                    <div style="font-size: 11px; font-weight: 800; margin-bottom: 12px;">${item.price} ТК</div>
                    <button type="button" onclick="buyItem('${item.id}')" class="tf-btn" style="padding: 6px; font-size: 16px;">Купити</button>
                `;
                grid.appendChild(div);
            });
        }

        function buyItem(id) {
            let item = itemsDB.find(i => i.id === id);
            if(!item || balance < item.price) { alert('Недостатньо ТК!'); return; }
            balance -= item.price;
            inventory.push(item);
            updateUI();
            renderInv();
            alert(`Придбано: ${item.name}!`);
        }

        function sellItem(index) {
            let item = inventory[index];
            if(!item) return;
            balance += item.price;
            inventory.splice(index, 1);
            selectedInv = selectedInv.filter(i => i !== index).map(i => i > index ? i - 1 : i);
            updateUI();
            renderInv();
            if(!document.getElementById('section-inventory').classList.contains('hidden')) renderFullInv();
        }

        function renderCatalog() {
            const grid = document.getElementById('catalogGrid');
            if(!grid) return;
            grid.innerHTML = '';
            itemsDB.forEach(item => {
                const isSel = targetItem && targetItem.id === item.id;
                const div = document.createElement('div');
                div.className = `item-card ${item.qClass} ${isSel ? 'selected' : ''}`;
                div.style.flexDirection = "row";
                div.style.padding = "8px 12px";
                div.onclick = () => {
                    targetItem = item;
                    document.getElementById('targetName').innerText = item.name;
                    document.getElementById('targetBadge').innerText = item.quality.toUpperCase();
                    renderCatalog();
                    calcOdds();
                };
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="font-size: 20px;"><i class="fa-solid ${item.icon}"></i></div>
                        <span style="font-size: 11px; font-weight: 700; color: #fff;">${item.name}</span>
                    </div>
                    <span style="font-size: 11px; font-weight: 800;">${item.price} ТК</span>
                `;
                grid.appendChild(div);
            });
        }

        function calcOdds() {
            if(isSpinning) return;
            let direct = parseFloat(document.getElementById('directRef').value) || 0;
            let total = direct;
            selectedInv.forEach(idx => { if(inventory[idx]) total += inventory[idx].price; });
            document.getElementById('totalBet').innerText = `${total.toFixed(0)} ТК`;

            let btn = document.getElementById('upgradeBtn');
            if(!targetItem || total <= 0 || total >= targetItem.price) {
                drawWheel(0);
                if(btn) btn.disabled = true;
                return;
            }
            let chance = Math.min((total / targetItem.price) * 100, 95);
            drawWheel(chance);
            if(btn) btn.disabled = false;
        }

        // Малювання НЕРУХОМОГО круга (жовтий сектор — зона виграшу від 0° нагорі)
        function drawWheel(chance) {
            document.getElementById('chanceText').innerText = `${chance.toFixed(2)}%`;
            const canvas = document.getElementById('wheelCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 260, 260);

            // Фони секторів
            ctx.beginPath();
            ctx.arc(130, 130, 120, 0, Math.PI * 2);
            ctx.fillStyle = '#171311';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#3e3530';
            ctx.stroke();

            if(chance > 0) {
                let winAngle = (chance / 100) * (Math.PI * 2);
                ctx.beginPath();
                ctx.moveTo(130, 130);
                // Зона виграшу від 12 годин (-Math.PI/2) за годинниковою стрілкою
                ctx.arc(130, 130, 118, -Math.PI / 2, -Math.PI / 2 + winAngle);
                ctx.lineTo(130, 130);
                ctx.fillStyle = '#e7b53b';
                ctx.fill();
            }
        }

        // Запуск обертання СТРІЛКИ
        function startUpgrade() {
            if(isSpinning || !targetItem) return;
            let direct = parseFloat(document.getElementById('directRef').value) || 0;
            let total = direct;
            selectedInv.forEach(idx => { if(inventory[idx]) total += inventory[idx].price; });

            if(direct > balance) { alert('Недостатньо ТК!'); return; }
            if(direct > 0) { balance -= direct; document.getElementById('directRef').value = 0; }

            // Забираємо вибрані предмети
            inventory = inventory.filter((_, idx) => !selectedInv.includes(idx));
            selectedInv = [];
            updateUI(); 
            renderInv();

            isSpinning = true;
            document.getElementById('upgradeBtn').disabled = true;

            let chance = Math.min((total / targetItem.price) * 100, 95);
            let win = Math.random() * 100 < chance;

            // Обчислюємо кінцевий кут стрілки (у радіанах)
            // Зона виграшу охоплює від 0 rad до winRad (де 0 — вершина круга).
            let winRad = (chance / 100) * (Math.PI * 2);
            let targetRad = win ? (Math.random() * winRad) : (winRad + Math.random() * (Math.PI * 2 - winRad));
            
            // Додаємо 5 повних обертів (10 * Math.PI)
            let totalRotation = Math.PI * 2 * 5 + targetRad;

            let start = null;
            let duration = 3800; // тривалість у мс
            const spinnerElem = document.getElementById('arrowSpinner');

            function animateArrow(timestamp) {
                if(!start) start = timestamp;
                let progress = Math.min((timestamp - start) / duration, 1);
                
                // Плавна анімація сповільнення (cubic ease-out)
                let ease = 1 - Math.pow(1 - progress, 3);
                let currentRad = totalRotation * ease;

                // Оверлей стрілки повертається через CSS transform
                let currentDeg = (currentRad * 180) / Math.PI;
                spinnerElem.style.transform = `rotate(${currentDeg}deg)`;

                if(progress < 1) {
                    requestAnimationFrame(animateArrow);
                } else {
                    isSpinning = false;
                    if(win) { 
                        inventory.push(targetItem); 
                        alert(`🎉 УСПІХ! Ви виграли: ${targetItem.name}!`); 
                    } else { 
                        alert("❌ ПРОГРАШ! Спробуйте ще раз."); 
                    }
                    renderInv();
                }
            }
            requestAnimationFrame(animateArrow);
        }

        function updateUI() {
            document.getElementById('balCoins').innerText = `${balance.toFixed(0)} ТК`;
            localStorage.setItem('tf_coins', balance);
            localStorage.setItem('tf_inv', JSON.stringify(inventory));
        }

        window.onload = function() {
            updateUI();
            renderInv();
            renderCatalog();
        };
    </script>
</body>
</html>
